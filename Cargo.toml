[package]
name = "s3-inventory-bill"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
authors = ["PEPAI <pep_ai@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Offline S3 storage cost from inventory CSV"
readme = "README.md"
repository = "https://github.com/qwpp7g79y4-maker/s3-inventory-bill"
homepage = "https://www.pepai.nl"
documentation = "https://github.com/qwpp7g79y4-maker/s3-inventory-bill"
keywords = ["aws", "s3", "inventory", "cost", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["task.md", "blueprint.md", "*-plugin/"]

[lib]
name = "s3_inventory_bill"
path = "src/lib.rs"

[[bin]]
name = "s3-inventory-bill"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
rust_decimal = "1.43.0"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
