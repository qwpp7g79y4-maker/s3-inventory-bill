# Licenses accepted for the third-party crates in a release binary.
# `cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html`
# fails when a crate in the binary uses a license that is not listed here.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
