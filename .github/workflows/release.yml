name: Release

# Builds the archives of a release from a version tag, or from an existing tag
# when started by hand. The tests run first; nothing is built or published
# unless they pass.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v1.0.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  BIN: s3-inventory-bill

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  # The license file is generated once, on Linux, and shared by every build.
  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: THIRD-PARTY-LICENSES.html

  build:
    name: Build ${{ matrix.target }}
    needs: [ci, licenses]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc baseline low (checked below).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Statically linked, also runs on Alpine.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: licenses
      - name: Check the highest glibc symbol
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: bash scripts/check-glibc.sh "target/${{ matrix.target }}/release/${BIN}" 2.34
      - name: Package
        shell: bash
        run: |
          name="${BIN}-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md README.nl.md QUALITY.md QUALITY.nl.md SECURITY.md CONTRIBUTING.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "../target/${{ matrix.target }}/release/${BIN}.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp "../target/${{ matrix.target }}/release/${BIN}" "$name/"
            tar -czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -rf "$name"
      - name: Smoke test the archive
        shell: bash
        run: |
          name="${BIN}-${TAG}-${{ matrix.target }}"
          mkdir smoke
          cd smoke
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x "../dist/$name.zip" > /dev/null
            bin="./${BIN}.exe"
          else
            tar -xzf "../dist/$name.tar.gz"
            bin="./${BIN}"
          fi
          cd "$name"
          test -f THIRD-PARTY-LICENSES.html
          for f in SECURITY.md CONTRIBUTING.md QUALITY.nl.md; do test -f "$f"; done
          got=$("$bin" --version | tr -d '\r')
          echo "$got"
          test "$got" = "${BIN} ${TAG#v}"
          "$bin" --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: [ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*-*'
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          test "$(ls ./*.tar.gz ./*.zip | wc -l)" -eq 5
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber ./*
          else
            gh release create "$TAG" --title "${BIN} $TAG" --generate-notes --verify-tag ./*
          fi
